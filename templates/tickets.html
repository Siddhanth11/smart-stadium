<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tickets | Smart Stadium</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🏟️ Smart Stadium
        </a>

        <a href="/dashboard"
           class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

</nav>

<!-- Ticket Booking -->

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">

                🎫 Book Match Ticket

            </h3>

        </div>

        <div class="card-body">

            <form action="/ticket/book" method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Select Match

                    </label>

                    <select
                        class="form-select"
                        name="match">

                        <option>India vs Brazil</option>

                        <option>Germany vs Argentina</option>

                        <option>France vs Spain</option>

                        <option>England vs Portugal</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Seat Category

                    </label>

                    <select
                        class="form-select"
                        name="seat">

                        <option>VIP</option>

                        <option>Premium</option>

                        <option>Standard</option>

                        <option>Budget</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Number of Tickets

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="tickets"
                        value="1"
                        min="1"
                        max="10">

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Book Ticket

                </button>

            </form>

        </div>

    </div>

    <!-- Ticket Information -->

    <div class="card mt-4">

        <div class="card-header bg-success text-white">

            Match Information

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>Match</th>

                        <th>Date</th>

                        <th>Time</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>India vs Brazil</td>

                        <td>15 July 2026</td>

                        <td>7:30 PM</td>

                    </tr>

                    <tr>

                        <td>Germany vs Argentina</td>

                        <td>16 July 2026</td>

                        <td>6:00 PM</td>

                    </tr>

                    <tr>

                        <td>France vs Spain</td>

                        <td>17 July 2026</td>

                        <td>8:00 PM</td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center mt-5 p-3">

    © 2026 Smart Stadium GenAI

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
