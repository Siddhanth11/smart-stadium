<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Navigation | Smart Stadium</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🏟️ Smart Stadium
        </a>

        <a href="/dashboard"
           class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

</nav>

<!-- Navigation -->

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">

                🗺️ Stadium Navigation

            </h3>

        </div>

        <div class="card-body">

            <form>

                <div class="mb-3">

                    <label class="form-label">

                        Current Location

                    </label>

                    <select class="form-select">

                        <option>Gate A</option>
                        <option>Gate B</option>
                        <option>Gate C</option>
                        <option>Parking</option>
                        <option>Food Court</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Destination

                    </label>

                    <select class="form-select">

                        <option>Seat A</option>
                        <option>Seat B</option>
                        <option>Food Court</option>
                        <option>Medical Center</option>
                        <option>Parking</option>

                    </select>

                </div>

                <button
                    type="button"
                    class="btn btn-success"
                    onclick="showRoute()">

                    Find Route

                </button>

            </form>

            <hr>

            <div id="result">

                <h5>Route Information</h5>

                <p>

                    Select a source and destination.

                </p>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center mt-5 p-3">

    © 2026 Smart Stadium GenAI

</footer>

<script>

function showRoute(){

    document.getElementById("result").innerHTML = `

        <h5>Recommended Route</h5>

        <p><strong>Distance:</strong> 250 meters</p>

        <p><strong>Estimated Time:</strong> 3 Minutes</p>

        <p><strong>Route:</strong>
        Main Corridor → Left Turn → Destination
        </p>

    `;

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
