<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emergency | Smart Stadium</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

    <div class="container">

        <a class="navbar-brand" href="/">
            🚨 Smart Stadium Emergency
        </a>

        <a href="/dashboard"
           class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

</nav>

<!-- Emergency Dashboard -->

<div class="container mt-5">

    <h2 class="text-center mb-4 text-danger">

        🚨 Emergency Assistance

    </h2>

    <!-- Emergency Alert -->

    <div class="alert alert-danger">

        <strong>Emergency Status:</strong>

        No active emergency alerts.

    </div>

    <!-- Emergency Contacts -->

    <div class="card mb-4">

        <div class="card-header bg-danger text-white">

            Emergency Contacts

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>Service</th>

                        <th>Contact</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>Medical Team</td>

                        <td>+91 9876543210</td>

                    </tr>

                    <tr>

                        <td>Security</td>

                        <td>+91 9876543211</td>

                    </tr>

                    <tr>

                        <td>Fire Department</td>

                        <td>101</td>

                    </tr>

                    <tr>

                        <td>Police</td>

                        <td>100</td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Emergency Report Form -->

    <div class="card">

        <div class="card-header bg-warning">

            Report an Emergency

        </div>

        <div class="card-body">

            <form action="/emergency/report"
                  method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Emergency Type

                    </label>

                    <select
                        class="form-select"
                        name="type">

                        <option>Medical</option>

                        <option>Fire</option>

                        <option>Security</option>

                        <option>Crowd</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Location

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="location"
                        placeholder="Enter Location">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        class="form-control"
                        rows="4"
                        name="description"
                        placeholder="Describe the emergency"></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-danger">

                    Report Emergency

                </button>

            </form>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center mt-5 p-3">

    © 2026 Smart Stadium GenAI

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
